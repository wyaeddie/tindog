# Generate the Xcode project:  brew install xcodegen && xcodegen generate && open SuspensionTuner.xcodeproj
name: SuspensionTuner
options:
  bundleIdPrefix: com.example.suspensiontuner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SuspensionTuner:
    path: .
targets:
  SuspensionTuner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources/SuspensionTunerApp]
    dependencies:
      - package: SuspensionTuner
        product: SuspensionKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
