# Generate the Xcode project:  brew install xcodegen && xcodegen generate && open SuspensionTuner.xcodeproj
#
# Bundle ID: solutions.wholestack.suspensiontuner (from wholestack.solutions). It must match
# the app record in App Store Connect. To publish, run ./release.sh (see release/APP_STORE.md).
name: SuspensionTuner
options:
  bundleIdPrefix: solutions.wholestack
  deploymentTarget:
    iOS: "17.0"
packages:
  SuspensionTuner:
    path: .
targets:
  SuspensionTuner:
    type: application
    platform: iOS                         # iPhone (also runs on iPad)
    scheme: {}                            # shared scheme so release.sh / xcodebuild can find it
    sources:
      - Sources/SuspensionTunerApp
      - AppResources                # Assets.xcassets (AppIcon, optional logo-<brand> images), privacy manifest
    dependencies:
      - package: SuspensionTuner
        product: SuspensionKit
    settings:
      base:
        # Set explicitly so the app always has an ID; without one iOS kills it at launch
        # (BUNDLE_IDENTIFIER_FOR_CURRENT_PROCESS_IS_NIL).
        PRODUCT_BUNDLE_IDENTIFIER: solutions.wholestack.suspensiontuner
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Suspension Tuner
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Whole Stack Solutions. All rights reserved."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # No encryption beyond HTTPS → skips the export-compliance question on every upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Share sheet → "Save Image" writes to Photos; iOS requires this text or the app crashes
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your suspension setup as an image in Photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad must support all orientations (App Store requirement for multitasking)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
