# Generate the Xcode project:  brew install xcodegen && xcodegen generate && open SuspensionTuner.xcodeproj
#
# BEFORE PUBLISHING: change bundleIdPrefix below to something you own (reverse domain,
# e.g. com.yourname). The final bundle ID becomes <prefix>.SuspensionTuner and must match
# the app record you create in App Store Connect.
name: SuspensionTuner
options:
  bundleIdPrefix: com.example.suspensiontuner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SuspensionTuner:
    path: .
targets:
  SuspensionTuner:
    type: application
    supportedDestinations: [iOS, macOS]   # one app record → iPhone, iPad and Mac (universal purchase)
    scheme: {}                            # shared scheme so build-mac.sh / xcodebuild can find it
    sources:
      - Sources/SuspensionTunerApp
      - path: AppResources          # Assets.xcassets: AppIcon + optional logo-<brand> images
        excludes: ["*.entitlements"]
    dependencies:
      - package: SuspensionTuner
        product: SuspensionKit
    settings:
      base:
        # Set explicitly so the app always has an ID; without one iOS kills it at launch
        # (BUNDLE_IDENTIFIER_FOR_CURRENT_PROCESS_IS_NIL). Change along with bundleIdPrefix.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.suspensiontuner.SuspensionTuner
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Suspension Tuner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # No encryption beyond HTTPS → skips the export-compliance question on every upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Share sheet → "Save Image" writes to Photos; iOS requires this text or the app crashes
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your suspension setup as an image in Photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad must support all orientations (App Store requirement for multitasking)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Mac App Store requires the App Sandbox; printing needs its own entitlement
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AppResources/SuspensionTuner-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
